<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Seguridad: no enviar Referer completo al navegar fuera -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Seguridad: evitar que navegadores antiguos detecten tipos MIME incorrectos -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <!-- Seguridad: impedir que la app se cargue en un iframe (clickjacking) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Seguridad: CSP básica — ajustar en producción según el servidor -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self' 'unsafe-inline';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               connect-src 'self';
               font-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PhishSim — Simulación de concienciación</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
